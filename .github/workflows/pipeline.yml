name: Predictive Engine Maintenance — ML Pipeline

on:
  push:
    branches:
      - main

jobs:
  ml-pipeline:
    runs-on: ubuntu-latest

    steps:

      # Step 1 - Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2 - Set up Python 3.9
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      # Step 3 - Install all dependencies
      - name: Install Requirements
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4 - ML Step: Data Preparation
      - name: Data Preparation
        run: |
          python prepare_data.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      # Step 5 - ML Step: Model Building and Experimentation
      - name: Model Building and Experimentation
        run: |
          python train.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      # Step 6 - ML Step: Validate Streamlit App
      - name: Validate Streamlit App
        run: |
          python -m py_compile app/app.py
          echo "app/app.py syntax check passed"

      # Step 7 - ML Step: Deploy App to Hugging Face Space
      - name: Deploy to Hugging Face Space
        run: |
          python deploy.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      # Step 8 - Auto-push artifacts back to main branch
      - name: Commit and Push Artifacts to Main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add engine-predictive-maintenance/reports/ engine-predictive-maintenance/models/ engine-predictive-maintenance/data/processed/ engine-predictive-maintenance/data/splits/
          git diff --staged --quiet || git commit -m "ci: auto-update model artifacts [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 9 - Pipeline complete
      - name: Done
        run: |
          echo "========================================"
          echo "End-to-end ML pipeline completed successfully"
          echo "========================================"